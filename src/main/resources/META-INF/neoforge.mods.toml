modLoader = "javafml"
loaderVersion = "[1,)"
license = "All Rights Reserved"

[[mods]]
modId = "vanilla_timber"
version = "${version}"
displayName = "${name}"
authors = "${author}"
displayURL = "${homepage}"
description = '''${description}'''
# vanilla clients join a server with Timber, and a client with Timber joins any server
displayTest = "IGNORE_ALL_VERSION"

[[mixins]]
config = "vanilla_timber.mixins.json"

[[dependencies.vanilla_timber]]
modId = "minecraft"
type = "required"
versionRange = "[${mc},${mc_next})"
ordering = "NONE"
side = "BOTH"
