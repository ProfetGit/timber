pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.toString() == 'org.spongepowered.mixin') useModule('org.spongepowered:mixingradle:0.7.+')
        }
    }
}
rootProject.name = 'vanilla_timber_forge_1_20_1'
